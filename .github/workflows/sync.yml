name: Sync README from site

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch content.md from umqadir.github.io
        run: |
          {
            echo "<!-- Generated from https://github.com/umqadir/umqadir.github.io/blob/main/content.md - edit there, not here. -->"
            curl -fsSL https://raw.githubusercontent.com/umqadir/umqadir.github.io/main/content.md
          } > README.md
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Sync README from umqadir.github.io content.md"
            git push
          fi
